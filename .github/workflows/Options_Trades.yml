name: Daily Options Pipeline

on:
  schedule:
    # 13:00 UTC corresponds to 8:00 AM CDT. (Note: UTC does not observe daylight saving time).
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Adjust this to match the version you used in development

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Google Cloud Credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          # Writes the secret JSON string into a temporary file for the Google client libraries to read
          echo "$GCP_SERVICE_ACCOUNT_KEY" > gcp-key.json

      - name: Execute Quantitative Pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The Google SDK automatically looks for this environment variable
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          # Replace 'main.py' with the actual name of your headless Python script
          python main.py
